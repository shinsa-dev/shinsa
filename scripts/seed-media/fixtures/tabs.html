<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Editor</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font: 13px/1.4 -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; }
body { --bg:#f6f6f7; --panel:#fff; --fg:#18181b; --muted:#71717a; --border:#e4e4e7; --chip:#f4f4f5; --accent:#7c3aed; }
body.dark { --bg:#0f0f11; --panel:#18181b; --fg:#f4f4f5; --muted:#a1a1aa; --border:#2e2e33; --chip:#232327; --accent:#a78bfa; }
body { background: var(--bg); color: var(--fg); }
header { height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--border); font-weight: 600; }
header .crumb { color: var(--muted); font-weight: 400; }
.layout { display: grid; grid-template-columns: 1fr 340px; gap: 16px; padding: 16px; }
.canvas { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; min-height: 560px; display: grid; place-items: center; }
.phone { width: 240px; height: 480px; border-radius: 28px; border: 6px solid var(--fg); background: linear-gradient(160deg,#7c3aed,#db2777); display: flex; flex-direction: column; justify-content: end; padding: 20px; color: #fff; }
.phone b { font-size: 20px; } .phone span { opacity: .85; font-size: 12px; margin: 6px 0 14px; } .phone i { font-style: normal; background: #fff; color: #18181b; border-radius: 10px; text-align: center; padding: 10px; font-weight: 600; }
.inspector { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; min-width: 0; }
.inspector h3 { margin: 0; padding: 12px 14px; font-size: 12px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }
.tabs { display: flex; gap: 4px; padding: 0 10px 10px; border-bottom: 1px solid var(--border); }
.tab { padding: 5px 10px; border-radius: 7px; background: var(--chip); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: clip; cursor: pointer; }
.tab[data-active] { background: var(--accent); color: #fff; }
body.after .tabs { overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; }
body.after .tab { flex-shrink: 0; }
.fields { padding: 14px; display: grid; gap: 12px; }
.field .label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 4px; }
.field div { background: var(--chip); border-radius: 7px; padding: 7px 9px; }
@media (max-width: 600px) { .layout { grid-template-columns: 1fr; } .canvas { display: none; } }
</style></head>
<body>
<header>Paywall editor <span class="crumb">/ Spring sale / Variant B</span></header>
<div class="layout">
<div class="canvas"><div class="phone"><b>Unlock everything</b><span>Spring sale: 40% off the yearly plan</span><i>Start free trial</i></div></div>
<div class="inspector"><h3>Screens</h3>
<div class="tabs" id="tabs"></div>
<div class="fields"><div class="field"><span class="label">Headline</span><div>Unlock everything</div></div><div class="field"><span class="label">Subtitle</span><div>Spring sale: 40% off the yearly plan</div></div><div class="field"><span class="label">Button</span><div>Start free trial</div></div><div class="field"><span class="label">Product</span><div>pro_yearly_spring</div></div></div>
</div></div>
<script>
const params = new URLSearchParams(location.search);
document.body.className = `${params.get('mode') || 'after'} ${params.get('theme') || 'light'}`;
const names = ['Welcome','Features','Reviews','Pricing','Trial','Annual offer','Monthly offer','Win-back offer','Exit survey','Thank you','Restore','Terms','Upsell','Family plan'];
const row = document.getElementById('tabs');
const active = params.get('active') || 'Welcome';
for (const name of names) { const t = document.createElement('span'); t.className = 'tab'; t.textContent = name; if (name === active) t.dataset.active = ''; t.onclick = () => { for (const x of row.querySelectorAll('.tab')) delete x.dataset.active; t.dataset.active = ''; if (document.body.classList.contains('after')) t.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); }; row.append(t); }
</script>
</body></html>
