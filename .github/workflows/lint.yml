name: Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun format
      - run: bun lint:oxlint
      - run: bun lint:html
      - run: bun lint:styles
      - run: bun lint:conventions
      - run: bun lint:spelling
      - name: Changelog
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            bun scripts/changelog.ts check --base "origin/$BASE_REF"
          else
            bun scripts/changelog.ts check
          fi
      - run: bunx sherif -i @types/node
      - run: bunx knip
      - run: bun check-types
