name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'apps/marketing/**'
      - 'apps/web/**'
      - 'apps/server/src/agents/policy.ts'
      - 'packages/**'
      - 'bun.lock'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://shinsa.dev
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: apps/marketing
      - run: bunx wrangler@4 deploy
        working-directory: apps/marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
