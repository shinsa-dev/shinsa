name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install GitButler's but
        run: |
          dpkg -s libdbus-1-3 >/dev/null 2>&1 || sudo apt-get install -y libdbus-1-3
          curl -fsSL https://gitbutler.com/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: but --version
      - run: bun run test
