name: Test

on:
  push:
    branches: [main]
    paths: &tested
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - docs/cli.md
      - docs/design-system.md
      - .claude/skills/**
      - apps/engine/plugin/**
  pull_request:
    paths: *tested

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test
