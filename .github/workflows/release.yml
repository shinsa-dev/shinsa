name: Release

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: Stable is a normal release marked latest; beta is a pre-release of the next version; canary is a pre-release of main for the Canary channel, as every tested merge makes
        type: choice
        options: [beta, stable, canary]
        default: beta
      bump:
        description: Which part of the last stable version goes up (docs/release.md); a canary ignores it
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  statuses: write

jobs:
  trigger:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      channel: ${{ steps.decide.outputs.channel }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "channel=$INPUT_CHANNEL" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "channel=canary" >> "$GITHUB_OUTPUT"
            bun scripts/release-canary.ts
          fi

  mac:
    needs: trigger
    if: needs.trigger.outputs.build == 'true'
    concurrency:
      group: ${{ needs.trigger.outputs.channel == 'canary' && 'release-canary' || 'release' }}
      cancel-in-progress: ${{ needs.trigger.outputs.channel == 'canary' }}
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Mark the commit's release as pending
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.trigger.outputs.sha }}
          CHANNEL: ${{ needs.trigger.outputs.channel }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$RELEASE_SHA" \
            -f state=pending -f context=Release \
            -f description="Building the $CHANNEL release" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.trigger.outputs.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Next version
        id: version
        env:
          RELEASE_CHANNEL: ${{ needs.trigger.outputs.channel }}
          RELEASE_BUMP: ${{ inputs.bump || 'patch' }}
        run: bun scripts/release.ts
      - name: Signing preflight
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -eq 0 ]; then
            mode=signed
            line="Signed with the Developer ID Application certificate and notarized by Apple: it opens without a Gatekeeper prompt and updates itself."
          elif [ ${#missing[@]} -eq 5 ]; then
            mode=unsigned
            line="Not signed (ad hoc) and not notarized: no signing secrets are set. It installs, macOS asks before the first launch, and it never updates itself, since Squirrel.Mac installs only signed updates (docs/release.md)."
          else
            echo "::error title=Signing::Some signing secrets are set and some are missing (${missing[*]}). Set all five or none (docs/release.md)."
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "::notice title=Signing::$line"
          printf '**Signing:** %s\n\n' "$line" >> "$GITHUB_STEP_SUMMARY"
      - run: bun run build
        working-directory: apps/web
      - name: Build the engine
        env:
          SHINSA_VERSION: ${{ steps.version.outputs.version }}
        run: bun apps/engine/scripts/build-engine.ts
      - run: bun run build
        working-directory: apps/desktop
      - name: Build and sign the app
        working-directory: apps/desktop
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MODE: ${{ steps.signing.outputs.mode }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          signing=(-c.mac.identity=-)
          if [ "$MODE" = signed ]; then signing=(); fi
          bunx electron-builder --mac dir --arm64 --publish never --config electron-builder.yml \
            -c.extraMetadata.version="$VERSION" \
            -c.mac.notarize=false \
            "${signing[@]}"
      - name: Notarize and staple
        if: steps.signing.outputs.mode == 'signed'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bun scripts/release-notarize.ts apps/desktop/release/mac-arm64/Shinsa.app
      - name: Package the disk image and the zip
        working-directory: apps/desktop
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          MODE: ${{ steps.signing.outputs.mode }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          signing=(-c.mac.identity=-)
          if [ "$MODE" = signed ]; then signing=(); fi
          config=(--config electron-builder.yml)
          case "$CHANNEL" in
            beta | canary) config+=(-c.dmg.background="dmg/background-$CHANNEL.png") ;;
          esac
          bunx electron-builder --mac dmg zip --arm64 --publish never "${config[@]}" \
            --prepackaged release/mac-arm64/Shinsa.app \
            -c.extraMetadata.version="$VERSION" \
            -c.mac.notarize=false \
            "${signing[@]}"
      - name: Check the versions and the signature
        working-directory: apps/desktop/release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MODE: ${{ steps.signing.outputs.mode }}
        run: |
          app=mac-arm64/Shinsa.app
          plist="$app/Contents/Info.plist"
          bundled=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          report=$("$app/Contents/Resources/engine/bin/shinsa" version --json)
          engine=$(jq -r .command.version <<<"$report")
          echo "Release $VERSION, app $bundled ($bundle_id), engine $engine"
          if [ "$bundled" != "$VERSION" ] || [ "$engine" != "$VERSION" ]; then
            echo "::error title=Versions::The app ($bundled) and its engine ($engine) must both be $VERSION."
            exit 1
          fi
          if [ "$bundle_id" != studio.overclock.shinsa ]; then
            echo "::error title=Identity::Every channel builds studio.overclock.shinsa, not $bundle_id."
            exit 1
          fi
          if [ ! -f "$app/Contents/Resources/app-update.yml" ]; then
            echo "::error title=Updates::The app has no Contents/Resources/app-update.yml, so it could never download an update (docs/release.md)."
            exit 1
          fi
          codesign --verify --deep --strict "$app"
          if [ "$MODE" = signed ]; then
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          fi
      - name: Pack the engine
        env:
          SHINSA_VERSION: ${{ steps.version.outputs.version }}
        run: bun scripts/release-engine.ts bun-darwin-arm64 apps/desktop/release/mac-arm64/Shinsa.app/Contents/Resources/engine apps/desktop/release
      - name: Update files for the channels
        working-directory: apps/desktop/release
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$CHANNEL" = stable ]; then
            cp latest-mac.yml beta-mac.yml
            files=(latest-mac.yml beta-mac.yml)
          else
            mv latest-mac.yml "$CHANNEL-mac.yml"
            files=("$CHANNEL-mac.yml")
          fi
          for file in "${files[@]}"; do
            if ! grep -qx "version: $VERSION" "$file"; then
              echo "::error title=Update files::$file does not name $VERSION."
              exit 1
            fi
          done
          printf '%s\n' "${files[@]}" > update-files.txt
      - name: Publish the release
        working-directory: apps/desktop/release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          NOTES: ${{ steps.version.outputs.notes }}
          NOTES_START_TAG: ${{ steps.version.outputs.notes_start_tag }}
          RELEASE_SHA: ${{ needs.trigger.outputs.sha }}
        run: |
          updates=()
          while IFS= read -r file; do updates+=("$file"); done < update-files.txt
          if [ "$CHANNEL" = stable ]; then
            kind=(--latest)
            title="Shinsa $VERSION"
          else
            kind=(--prerelease --latest=false)
            title="Shinsa $VERSION ($CHANNEL)"
          fi
          if [ "$CHANNEL" = canary ] && [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release delete "$TAG" --yes
          fi
          if [ -n "$NOTES_START_TAG" ]; then kind+=(--notes-start-tag "$NOTES_START_TAG"); fi
          gh release create "$TAG" --target "$RELEASE_SHA" --title "$title" \
            --generate-notes --notes "$NOTES" "${kind[@]}" \
            Shinsa-mac-arm64.dmg Shinsa-mac-arm64.dmg.blockmap \
            Shinsa-mac-arm64.zip Shinsa-mac-arm64.zip.blockmap \
            shinsa-darwin-arm64.tar.gz shinsa-darwin-arm64.tar.gz.sha256 \
            "${updates[@]}"
          printf '**Published** [%s](%s/%s/releases/tag/%s).\n' "$title" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TAG" >> "$GITHUB_STEP_SUMMARY"

  linux:
    needs: [trigger, mac]
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            runner: ubuntu-latest
          - target: bun-linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.trigger.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: apps/web
      - name: Build the engine
        env:
          SHINSA_VERSION: ${{ needs.mac.outputs.version }}
          SHINSA_ENGINE_TARGET: ${{ matrix.target }}
        run: bun apps/engine/scripts/build-engine.ts
      - name: Pack the engine
        env:
          SHINSA_VERSION: ${{ needs.mac.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: bun scripts/release-engine.ts "$TARGET" "apps/engine/dist/engine-${TARGET#bun-}" release-engine
      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.mac.outputs.tag }}
        run: gh release upload "$TAG" release-engine/*.tar.gz release-engine/*.tar.gz.sha256 --clobber

  downloads:
    needs: [trigger, mac, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.trigger.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Serve the downloads and updates from shinsa.dev
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_TAG: ${{ needs.mac.outputs.tag }}
        run: bun scripts/release-upload.ts

  npm:
    needs: [trigger, mac, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.trigger.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm that publishes through trusted publishing
        run: npm install -g npm@^11.5.1
      - name: Download the engines
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.mac.outputs.tag }}
        run: gh release download "$TAG" --pattern 'shinsa-*.tar.gz' --pattern 'shinsa-*.tar.gz.sha256' --dir release-engine
      - name: Publish to npm
        env:
          SHINSA_VERSION: ${{ needs.mac.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.mac.outputs.channel }}
        run: bun scripts/release-npm.ts release-engine npm-packages

  status:
    needs: [trigger, mac, linux, downloads, npm]
    if: ${{ always() && (needs.trigger.result == 'failure' || needs.trigger.outputs.build == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Report the release on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.trigger.outputs.sha || github.event.workflow_run.head_sha || github.sha }}
          CHANNEL: ${{ needs.trigger.outputs.channel || inputs.channel || 'canary' }}
          TAG: ${{ needs.mac.outputs.tag }}
          TRIGGER: ${{ needs.trigger.result }}
          MAC: ${{ needs.mac.result }}
          LINUX: ${{ needs.linux.result }}
          DOWNLOADS: ${{ needs.downloads.result }}
          NPM: ${{ needs.npm.result }}
        run: |
          case "$TRIGGER/$MAC/$LINUX/$DOWNLOADS/$NPM" in
            success/success/success/success/success) state=success description="Published $TAG" ;;
            failure/*) state=failure description="Could not decide whether to build the $CHANNEL release" ;;
            *cancelled*) state=error description="Cancelled" ;;
            */success/success/success/*) state=failure description="Published $TAG, but npm was not updated" ;;
            */success/success/*/success) state=failure description="Published $TAG, but the downloads were not updated" ;;
            */success/success/*) state=failure description="Published $TAG, but neither the downloads nor npm were updated" ;;
            */success/*) state=failure description="Published $TAG, but the Linux engines were not added" ;;
            *) state=failure description="The $CHANNEL release failed to build" ;;
          esac
          echo "Release status for $RELEASE_SHA: $state ($description)"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$RELEASE_SHA" \
            -f state="$state" -f context=Release \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
