appId: studio.overclock.shinsa
productName: Shinsa
directories:
  output: release
  buildResources: resources
files:
  - dist/**
  - static/**
  - package.json
extraResources:
  - from: ../engine/dist/engine
    to: engine
extraFiles:
  - from: resources/LaunchAgents
    to: Library/LaunchAgents
protocols:
  - name: Shinsa
    schemes:
      - shinsa
mac:
  target:
    - target: dir
      arch: arm64
  icon: icon.icns
  artifactName: Shinsa-mac-${arch}.${ext}
  category: public.app-category.developer-tools
  minimumSystemVersion: "14.0"
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
publish:
  provider: github
  owner: shinsa-dev
  repo: shinsa
